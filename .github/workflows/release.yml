name: Release

# Ao subir uma tag vX.Y.Z, empacota a extensão e publica na aba Releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confere se a tag bate com a versão do manifest
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")"
          if [ "$tag" != "$ver" ]; then
            echo "Tag v$tag não bate com manifest.json ($ver)" >&2
            exit 1
          fi

      - name: Empacota (manifest.json na raiz do zip, caminhos com /)
        run: |
          cd extension
          zip -r "../personalize-sendi-${GITHUB_REF_NAME}.zip" . -x '*.DS_Store'

      - name: Publica a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "personalize-sendi-${GITHUB_REF_NAME}.zip" \
            --title "Personalize Sendi ${GITHUB_REF_NAME}" \
            --generate-notes
